<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # cadviewer-php-scripts ships diagnostics, logs and SQL dumps that must not be reachable
    <Directory /var/www/html/public/php>
        <FilesMatch "^(phpinfo|phpversion|whoami2?|checkmail|info|testrun)\.php$|\.(sql|txt|log|bak)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/public/php/logs>
        Require all denied
    </Directory>
    <Directory /var/www/html/public/php/legacy_php>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
